<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETEC Lab | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-color: #B11116;
            --text-dark: #333;
            --background-color: #f5f5f5;
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        .header__title {
            color: var(--primary-color);
        }

        .btn-conectar {
            background-color: var(--primary-color);
            transition: background-color 0.2s;
        }

        .btn-conectar:hover {
            background-color: #8c0d11;
        }

        .full-center {
            min-height: 100vh;
            background-color: var(--background-color);
        }

        .error-message {
            color: var(--primary-color);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="full-center flex flex-col items-center justify-center text-gray-800">
    
    <header class="header text-center p-6 sm:p-8">
        <h1 class="header__title text-4xl font-extrabold mb-1">ETECLAB</h1>
        <p class="text-gray-500 text-sm leading-relaxed">Sistema de Agendamento e Gerenciamento<br>ETEC Júlio de Mesquita</p>
    </header>

    <main class="login-container w-full max-w-sm bg-white rounded-lg shadow-xl mb-8 overflow-hidden">
        
        <div class="login-header bg-[var(--primary-color)] text-white p-4 text-center">
            <h2 class="text-lg font-medium">Acesso ao Sistema</h2>
        </div>

        <form class="login-form p-6" onsubmit="realizarLogin(event)">
            
            <div class="space-y-4">
                <div class="form-group">
                    <label for="email" class="block text-sm font-semibold mb-1">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required 
                           class="w-full px-4 py-2 text-sm border border-gray-300 rounded-md bg-gray-100 focus:outline-none focus:border-[var(--primary-color)] transition duration-200">
                </div>

                <div class="form-group">
                    <label for="password" class="block text-sm font-semibold mb-1">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required 
                           class="w-full px-4 py-2 text-sm border border-gray-300 rounded-md bg-gray-100 focus:outline-none focus:border-[var(--primary-color)] transition duration-200">
                </div>
            </div>

            <div id="error-message" class="error-message text-center mt-4"></div>

            <button type="submit" id="btn-submit" class="btn-conectar mt-6 w-full text-white font-bold py-3 rounded-md shadow-md focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:ring-opacity-50 flex items-center justify-center">
                <span id="btn-text">Conectar</span>
                <div id="btn-spinner" class="spinner hidden"></div>
            </button>
        </form>
    </main>

    <footer class="footer text-center w-full p-4 absolute bottom-0">
        <p class="text-xs text-gray-500">&copy; 2025 ETEC Júlio de Mesquita - Centro Paula Souza</p>
    </footer>
    <script src="js/login.js"></script>
</body>
</html>
