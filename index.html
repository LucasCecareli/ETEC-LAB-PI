<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETEC Lab | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <h1 class="header__title">ETECLAB</h1>
        <p class="header__subtitle">Sistema de Agendamento e Gerenciamento<br>ETEC Júlio de Mesquita</p>
    </header>

    <main class="login-container">
        <div class="login-header">
            <h2>Acesso ao Sistema</h2>
        </div>

        <form class="login-form">
            <div class="form-group">
                <label for="login">Login</label>
                <input type="text" id="login" name="login" placeholder="Digite seu login" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn-conectar">Conectar</button>
        </form>
    </main>

    <footer class="footer">
        <p>&copy; 2025 ETEC Júlio de Mesquita - Centro Paula Souza</p>
    </footer>

    <script src="js/login.js"></script>
</body>

</html>
