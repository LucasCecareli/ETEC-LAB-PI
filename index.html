<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETEC Lab | Login</title>
    <!-- Carrega o Tailwind CSS para styling moderno e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Variáveis de Cores */
        :root {
            --primary-color: #B11116; /* Vermelho escuro da ETEC */
            --text-dark: #333;
            --background-color: #f5f5f5;
        }

        /* Define a fonte Inter (padrão de design) */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Estilos customizados para herdar as variáveis e garantir o hover */
        .header__title {
            color: var(--primary-color);
        }

        .btn-conectar {
            background-color: var(--primary-color);
            transition: background-color 0.2s;
        }

        .btn-conectar:hover {
            background-color: #8c0d11; /* Um tom mais escuro no hover */
        }

        /* A classe crucial para o centramento vertical e horizontal */
        .full-center {
            min-height: 100vh;
            background-color: var(--background-color);
        }

    </style>
    <!-- Configuração do Tailwind para usar a fonte Inter -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>

<body class="full-center flex flex-col items-center justify-center text-gray-800">

    <!-- O body agora usa flexbox para centralizar TUDO (justify-center e items-center) -->
    
    <header class="header text-center p-6 sm:p-8">
        <h1 class="header__title text-4xl font-extrabold mb-1">ETECLAB</h1>
        <p class="text-gray-500 text-sm leading-relaxed">Sistema de Agendamento e Gerenciamento<br>ETEC Júlio de Mesquita</p>
    </header>

    <main class="login-container w-full max-w-sm bg-white rounded-lg shadow-xl mb-8 overflow-hidden">
        
        <!-- Cabeçalho Vermelho "Acesso ao Sistema" -->
        <div class="login-header bg-[var(--primary-color)] text-white p-4 text-center">
            <h2 class="text-lg font-medium">Acesso ao Sistema</h2>
        </div>

        <!-- Formulário de Login -->
        <form class="login-form p-6" onsubmit="event.preventDefault(); alert('Conectando...');">
            
            <div class="space-y-4">
                <div class="form-group">
                    <label for="login" class="block text-sm font-semibold mb-1">Login</label>
                    <input type="text" id="login" name="login" placeholder="Digite seu login" required 
                           class="w-full px-4 py-2 text-sm border border-gray-300 rounded-md bg-gray-100 focus:outline-none focus:border-[var(--primary-color)] transition duration-200">
                </div>

                <div class="form-group">
                    <label for="senha" class="block text-sm font-semibold mb-1">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required 
                           class="w-full px-4 py-2 text-sm border border-gray-300 rounded-md bg-gray-100 focus:outline-none focus:border-[var(--primary-color)] transition duration-200">
                </div>
            </div>

            <button type="submit" class="btn-conectar mt-6 w-full text-white font-bold py-3 rounded-md shadow-md focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:ring-opacity-50">
                Conectar
            </button>
        </form>
    </main>

    <footer class="footer text-center w-full p-4 absolute bottom-0">
        <p class="text-xs text-gray-500">&copy; 2025 ETEC Júlio de Mesquita - Centro Paula Souza</p>
    </footer>

    <!-- A tag <script> abaixo é mantida para simular a ação do botão e demonstrar que o formulário é funcional. -->
    <script>
        // No mundo real, aqui você teria sua lógica de login.
        // A função de alert está aqui apenas para substituir o antigo alert() e demonstrar a interação.
        function alert(message) {
            const container = document.createElement('div');
            container.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
            container.innerHTML = `
                <div class="bg-white p-6 rounded-lg shadow-2xl max-w-xs text-center">
                    <p class="text-gray-700 mb-4">${message}</p>
                    <button onclick="this.closest('.fixed').remove()" class="bg-[var(--primary-color)] text-white px-4 py-2 rounded-md hover:bg-red-700 transition">
                        OK
                    </button>
                </div>
            `;
            document.body.appendChild(container);
        }
    </script>
</body>

</html>
